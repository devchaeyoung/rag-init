name: npm audit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run npm audit (JSON)
        id: audit
        run: |
          set +e
          npm audit --json > /tmp/audit.json 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Generate report
        id: report
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const raw = fs.readFileSync('/tmp/audit.json', 'utf8');
            let audit;
            try {
              audit = JSON.parse(raw);
            } catch {
              core.setOutput('body', '## npm audit 보고서\n\n⚠️ JSON 파싱 실패\n\n```\n' + raw.slice(0, 3000) + '\n```');
              core.setOutput('total', '0');
              return;
            }

            const meta = audit.metadata?.vulnerabilities || {};
            const total = meta.total || 0;
            const counts = {
              critical: meta.critical || 0,
              high: meta.high || 0,
              moderate: meta.moderate || 0,
              low: meta.low || 0,
              info: meta.info || 0,
            };

            const badge = {
              critical: '🔴',
              high: '🟠',
              moderate: '🟡',
              low: '🔵',
              info: '⚪',
            };

            // 상태 헤더
            const status = total === 0
              ? '✅ 취약점이 발견되지 않았습니다.'
              : `⚠️ **${total}건**의 취약점이 발견되었습니다.`;

            // 요약 테이블
            const summaryRows = Object.entries(counts)
              .filter(([, v]) => v > 0)
              .map(([k, v]) => `| ${badge[k]} ${k.charAt(0).toUpperCase() + k.slice(1)} | **${v}**건 |`);

            // 취약점 상세 테이블
            const vulns = audit.vulnerabilities || {};
            const detailRows = [];

            for (const [name, info] of Object.entries(vulns)) {
              const severity = info.severity || 'info';
              const icon = badge[severity] || '⚪';
              const range = info.range || '-';

              // via에서 advisory 제목 추출
              let title = '-';
              let url = '';
              if (Array.isArray(info.via)) {
                const advisory = info.via.find(v => typeof v === 'object' && v.title);
                if (advisory) {
                  title = advisory.title;
                  url = advisory.url || '';
                }
              }

              const titleCell = url ? `[${title}](${url})` : title;

              // 수정 가능 여부
              let fix = '❌ 수정 불가';
              if (info.fixAvailable === true) {
                fix = '✅ `npm audit fix`';
              } else if (typeof info.fixAvailable === 'object') {
                const breaking = info.fixAvailable.name;
                const ver = info.fixAvailable.version;
                fix = `⚠️ \`--force\` (${breaking}@${ver})`;
              }

              // isDirect 여부
              const dep = info.isDirect ? '직접' : '간접';

              detailRows.push(`| ${icon} ${severity} | \`${name}\` (${range}) | ${titleCell} | ${dep} | ${fix} |`);
            }

            // 정렬: critical > high > moderate > low > info
            const order = { critical: 0, high: 1, moderate: 2, low: 3, info: 4 };
            detailRows.sort((a, b) => {
              const sa = Object.keys(order).find(k => a.includes(k)) || 'info';
              const sb = Object.keys(order).find(k => b.includes(k)) || 'info';
              return (order[sa] || 4) - (order[sb] || 4);
            });

            // 권장 조치 집계
            let fixable = 0;
            let breaking = 0;
            let nofix = 0;
            for (const info of Object.values(vulns)) {
              if (info.fixAvailable === true) fixable++;
              else if (typeof info.fixAvailable === 'object') breaking++;
              else nofix++;
            }

            // 의존성 정보
            const deps = audit.metadata?.dependencies || {};
            const depInfo = `전체 ${deps.total || '-'}개 패키지 (prod: ${deps.prod || '-'}, dev: ${deps.dev || '-'})`;

            // 마크다운 조합
            const lines = [
              `## 🔍 npm audit 보고서`,
              ``,
              status,
              ``,
              `### 📊 요약`,
              ``,
              `| 심각도 | 건수 |`,
              `|--------|------|`,
              ...summaryRows,
              ``,
              `> 📦 ${depInfo}`,
            ];

            if (detailRows.length > 0) {
              lines.push(
                ``,
                `### 📋 취약점 상세`,
                ``,
                `| 심각도 | 패키지 | 취약점 | 의존성 | 수정 가능 |`,
                `|--------|--------|--------|--------|-----------|`,
                ...detailRows,
              );
            }

            if (total > 0) {
              lines.push(
                ``,
                `### 💡 권장 조치`,
                ``,
              );
              if (fixable > 0) lines.push(`- ✅ \`npm audit fix\`로 해결 가능: **${fixable}건**`);
              if (breaking > 0) lines.push(`- ⚠️ Breaking change 수반 (\`npm audit fix --force\`): **${breaking}건**`);
              if (nofix > 0) lines.push(`- ❌ 자동 수정 불가: **${nofix}건**`);
            }

            lines.push(``, `> 🤖 자동 생성된 보고서입니다.`);

            const body = lines.join('\n');
            core.setOutput('body', body);
            core.setOutput('total', String(total));

            // audit-report.md 파일로도 저장
            fs.writeFileSync('audit-report.md', body);

      - name: Write summary
        run: |
          cat << 'SUMMARY_EOF' >> $GITHUB_STEP_SUMMARY
          ${{ steps.report.outputs.body }}
          SUMMARY_EOF

      # workflow_dispatch: 취약점 발견 시 PR 생성
      - name: Create audit PR
        if: github.event_name == 'workflow_dispatch' && steps.report.outputs.total != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const today = new Date().toISOString().slice(0, 10);
            const branch = `audit/${today}`;

            // git 설정
            execSync('git config user.name "github-actions[bot]"');
            execSync('git config user.email "github-actions[bot]@users.noreply.github.com"');

            // 기존 브랜치 정리 후 생성
            try { execSync(`git push origin --delete ${branch}`, { stdio: 'ignore' }); } catch {}
            execSync(`git checkout -b ${branch}`);
            execSync('git add audit-report.md');
            execSync(`git commit -m "docs: npm audit 보고서 (${today})"`);
            execSync(`git push origin ${branch}`);

            const body = `${{ steps.report.outputs.body }}`;

            // 기존 audit PR이 열려있으면 닫기
            const { data: openPrs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:audit/`,
            });

            for (const pr of openPrs) {
              if (pr.head.ref.startsWith('audit/')) {
                await github.rest.pulls.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                  state: 'closed',
                });
              }
            }

            // PR 생성
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔒 보안 취약점 점검 보고서 (${today})`,
              body: body + '\n\n---\n\n> 이 PR은 `npm audit` 자동 점검으로 생성되었습니다.\n> Claude Code Review가 조치 계획서를 작성합니다.',
              head: branch,
              base: 'main',
            });

            // 라벨 자동 생성
            for (const label of ['security', 'npm-audit']) {
              try {
                await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: label });
              } catch {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label,
                  color: label === 'security' ? 'e11d48' : 'fbbc04',
                });
              }
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: ['security', 'npm-audit'],
            });

            core.notice(`PR 생성 완료: ${pr.html_url}`);

      # workflow_dispatch: 취약점 없으면 알림만
      - name: No vulnerabilities
        if: github.event_name == 'workflow_dispatch' && steps.report.outputs.total == '0'
        run: echo "✅ 취약점이 없어 PR을 생성하지 않습니다."

      # pull_request: 기존처럼 PR 코멘트
      - name: Comment PR with audit report
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = `${{ steps.report.outputs.body }}`;
            const prNumber = context.payload.pull_request.number;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('## 🔍 npm audit 보고서')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
